# SPDX-License-Identifier: AGPL-3.0-or-later
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --release --workspace --exclude fastmap-web -- -D warnings
      - run: cargo test --release
      - run: cargo run --release -p fastmap-core --example bench

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/web-tools
      - run: cargo clippy --release -p fastmap-web --target wasm32-unknown-unknown -- -D warnings
      - run: cargo xtask web --check-size
