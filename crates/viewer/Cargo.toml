[package]
name = "fastmap-viewer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Native FastMap viewer: development, benchmarking and screenshots"

[[bin]]
name = "fastmap-viewer"
path = "src/main.rs"

[dependencies]
fastmap-core.workspace = true
fastmap-render.workspace = true
wgpu = { workspace = true, features = ["wgsl", "std", "parking_lot", "vulkan", "metal", "dx12", "gles"] }
winit = "0.30"
pollster = "1"
png = "0.17"
